        <div class="hx-ch-copy"><span class="hx-badge">HABIT 01</span><h2 class="hx-ch-title">Be Proactive</h2><div class="hx-tags"><span>Initiative</span><span>Creativity</span><span>Exploration</span><span>Action</span></div></div>
      </header>
      <div class="hx-wrap">
        <figure class="hx-example">
          <span class="q" aria-hidden="true">&ldquo;</span>
          <div>
            <figcaption class="hx-kick">MY PERSONAL EXAMPLE</figcaption>
            <blockquote>
              <p>One example of proactivity in my life is the way I approach my personal projects. When I have an idea, I don't always wait for someone to tell me how to make it happen. I try to research, experiment with different tools and find ways to bring that idea to life.</p>
              <p>Sometimes things don't work as expected, but instead of giving up, I try different approaches and learn from my mistakes. I believe being proactive means <mark>taking responsibility for my own progress</mark> and making things happen instead of just waiting for opportunities.</p>
            </blockquote>
          </div>
        </figure>

        <section class="hx-cyc" aria-labelledby="hx-cyc-t" style="--step:0">
          <div class="hx-cyc-head"><div><span class="hx-kick">THE PROACTIVE CYCLE</span><h3 id="hx-cyc-t">From an idea to what I learn</h3></div><span class="hx-count" data-step-count>STAGE <b>1</b> / 4</span></div>
          <ol class="hx-flow">
            <li style="--c:#ffd58f"><button class="hx-stg" type="button" aria-pressed="true" aria-controls="hx-s1"><span class="art"><svg class="i"><use href="#i-bulb"/></svg></span><span class="no">STAGE 01</span><strong>IDEA</strong><span class="cap">It starts with an idea.</span></button></li>
            <li style="--c:#5ff3e6"><button class="hx-stg" type="button" aria-pressed="false" aria-controls="hx-s2"><span class="art"><svg class="i"><use href="#i-rocket"/></svg></span><span class="no">STAGE 02</span><strong>INITIATIVE</strong><span class="cap">I don't wait to be told how.</span></button></li>
            <li style="--c:#7fd2ff"><button class="hx-stg" type="button" aria-pressed="false" aria-controls="hx-s3"><span class="art"><svg class="i"><use href="#i-code"/></svg></span><span class="no">STAGE 03</span><strong>ACTION</strong><span class="cap">I experiment and build.</span></button></li>
            <li style="--c:#8ff0bd"><button class="hx-stg" type="button" aria-pressed="false" aria-controls="hx-s4"><span class="art"><svg class="i"><use href="#i-chart"/></svg></span><span class="no">STAGE 04</span><strong>LEARNING</strong><span class="cap">Mistakes become lessons.</span></button></li>
          </ol>
          <div class="hx-sv" aria-live="polite">
            <article id="hx-s1" style="--c:#ffd58f"><span class="big" aria-hidden="true">01</span><div><span class="hx-kick">IDEA</span><h4>It starts with an idea.</h4><p>When I have an idea for a personal project, I see it as something worth bringing to life — not just something to think about.</p></div><span class="to">Leads to <b>INITIATIVE</b></span></article>
            <article id="hx-s2" style="--c:#5ff3e6" hidden><span class="big" aria-hidden="true">02</span><div><span class="hx-kick">INITIATIVE</span><h4>I don't wait to be told how.</h4><p>Instead of waiting for someone to tell me how to make it happen, I research on my own and look for the tools that can make the idea possible.</p></div><span class="to">Leads to <b>ACTION</b></span></article>
            <article id="hx-s3" style="--c:#7fd2ff" hidden><span class="big" aria-hidden="true">03</span><div><span class="hx-kick">ACTION</span><h4>I experiment and build.</h4><p>I try different tools and approaches and start building. Sometimes things don't work as expected — that is part of the process.</p></div><span class="to">Leads to <b>LEARNING</b></span></article>
            <article id="hx-s4" style="--c:#8ff0bd" hidden><span class="big" aria-hidden="true">04</span><div><span class="hx-kick">LEARNING</span><h4>Mistakes become lessons.</h4><p>Instead of giving up, I try different approaches and learn from my mistakes. What I learn feeds the next idea — and the cycle starts again.</p></div><span class="to">Leads back to <b>IDEA</b></span></article>
          </div>
